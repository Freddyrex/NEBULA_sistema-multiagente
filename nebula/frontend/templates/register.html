{% extends "layout.html" %}
{% block body %}
{{ super() }}

<section id="home" class="home">
    <div class="container" style="text-align: center">
        <h1 class="logo" style="text-align: center">Sign Up</h1>
        <p style="text-align: center" class="fst-italic">Create a new account</p>
    </div>
</section>

<section id="register-section" class="base">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <form action="{{ url_for('nebula_register') }}" method='post'>
                    <div class="form-group">
                        <label for="user">Username</label>
                        <input type="text" class="form-control" name="user" id="user" placeholder="Enter username" required>
                    </div>
                    <div class="form-group mt-3">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="Enter password" required>
                    </div>
                    <div class="form-group mt-3">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="Confirm password" required>
                    </div>

                    <div class="form-group mt-3">
                        <button type="submit" class="btn btn-dark w-100">Sign Up</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <div style="font-size: small; color: #666;">Or sign in with</div>
                    <button type="button" id="firebase-register-btn" class="btn btn-outline-dark w-100 mt-2" onclick="firebaseGoogleSignIn(window.firebaseAuth, window.googleProvider).then(window.handleFirebaseSignIn).catch(e=>{console.error(e); alert('Firebase sign-in failed: '+e.message+'\n\nNota: Para usar Firebase Auth en localhost:8083, necesitas agregar este dominio en Firebase Console > Authentication > Settings > Authorized domains.');})">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" style="height: 18px; margin-right: 8px;">
                        Sign in with Google
                    </button>
                </div>
                <div class="mt-3 text-center">
                    <p>Already have an account? <a href="/platform">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
