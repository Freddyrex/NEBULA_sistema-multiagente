<!-- NEBULA · Chat flotante del agente (§8 gobernanza). Presente en toda la plataforma. -->
<button id="nb-chat-fab" class="nb-fab" data-open="false" data-notify="false"
        aria-label="Abrir chat con el agente" aria-expanded="false" aria-controls="nb-chat">
  <svg class="nb-fab__icon" viewBox="0 0 24 24" width="26" height="26" fill="none"
       stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true">
    <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>
    <circle cx="9" cy="12" r="1" fill="currentColor"/>
    <circle cx="15" cy="9.5" r="1" fill="currentColor"/>
    <circle cx="15" cy="14.5" r="1" fill="currentColor"/>
    <path d="M9 12l6-2.5M9 12l6 2.5"/>
  </svg>
  <span class="nb-fab__dot" aria-hidden="true"></span>
</button>

<section id="nb-chat" class="nb-chat" data-open="false" role="dialog"
         aria-label="Chat con el agente NEBULA" hidden>
  <header class="nb-chat__head">
    <span class="nb-chat__status" data-state="ready" aria-hidden="true"></span>
    <strong>Agente NEBULA</strong>
    <button class="nb-chat__dock" aria-label="Acoplar chat al panel" title="Acoplar" hidden>⛶</button>
    <button class="nb-chat__new" aria-label="Empezar de 0" title="Empezar de 0">⟲</button>
    <button class="nb-chat__close" aria-label="Cerrar chat">×</button>
  </header>

  <!-- Estado vivo del escenario en curso (§2.6): lo publica el panel SMAC
       vía NebulaAgent.ctx; si no hay contexto, permanece oculto. -->
  <div class="nb-chat__ctx" id="nb-chat-ctx" data-state="unknown" hidden>
    <div class="nb-ctx__top">
      <span class="nb-badge nb-ctx__status" data-state="unknown">—</span>
      <span class="nb-ctx__name" title=""></span>
    </div>
    <div class="nb-ctx__meta"></div>
  </div>

  <div class="nb-chat__log" role="log" aria-live="polite"></div>

  <div class="nb-chat__chips">
    <button class="nb-chip" data-prompt="Quiero crear un escenario nuevo. ¿Qué necesito?">Nuevo escenario</button>
    <button class="nb-chip" data-prompt="Resume el estado actual del escenario.">Ver estado</button>
  </div>

  <div class="nb-chat__input">
    <textarea rows="1" placeholder="Escribe un mensaje…" aria-label="Mensaje"></textarea>
    <button class="nb-chat__send" aria-label="Enviar mensaje">➤</button>
  </div>
</section>
