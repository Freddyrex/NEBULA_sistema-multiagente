name: Web Applications CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.114.0 httpx==0.27.2 pytest==9.1.1 ruff==0.16.9 mypy==1.20.2

      - name: Lint (Ruff)
        run: ruff check --no-fix nebula/healthcheck

      - name: Type check (mypy)
        run: mypy --no-error-summary nebula/healthcheck

      - name: Tests (pytest)
        run: python -m pytest -q tests/test_healthcheck.py tests/test_node_registry.py
